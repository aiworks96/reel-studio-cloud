name: Render Reel Video
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Render voice
        run: npm run render -- voice-test
        
      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-reel
          path: '**/*.mp4'

